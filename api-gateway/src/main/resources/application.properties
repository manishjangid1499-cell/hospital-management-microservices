# Server Configuration
server.port=9090
spring.application.name=api-gateway

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# Gateway Discovery Locator
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Auth Service Route
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter

# Patient Service Route
spring.cloud.gateway.routes[1].id=patient-service
spring.cloud.gateway.routes[1].uri=lb://patient-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/patients/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# Appointment Service Route
spring.cloud.gateway.routes[2].id=appointment-service
spring.cloud.gateway.routes[2].uri=lb://appointment-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/appointments/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# EHR Service Route
spring.cloud.gateway.routes[3].id=ehr-service
spring.cloud.gateway.routes[3].uri=lb://ehr-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/ehr/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

# Pharmacy Service Route
spring.cloud.gateway.routes[4].id=pharmacy-service
spring.cloud.gateway.routes[4].uri=lb://pharmacy-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/pharmacy/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter

# Billing Service Route
spring.cloud.gateway.routes[5].id=billing-service
spring.cloud.gateway.routes[5].uri=lb://billing-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/billing/**
spring.cloud.gateway.routes[5].filters[0]=AuthenticationFilter

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.web.resources.static-locations=file:${user.dir}/frontend/,file:${user.dir}/../frontend/
# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.genc.api_gateway=DEBUG

