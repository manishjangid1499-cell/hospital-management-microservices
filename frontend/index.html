<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Patient Care Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
    <style>
        .auth-card {
            max-width: 420px;
            margin: 60px auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            background: white;
        }
        .auth-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .auth-body {
            padding: 30px;
        }
        .auth-footer {
            padding: 15px 30px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            text-align: center;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-card fade-in">
        <div class="auth-header">
            <i class="bi bi-hospital logo-icon fs-1 mb-2 d-block"></i>
            <h2 class="h4 mb-1">Patient Care System</h2>
            <p class="small mb-0 opacity-75">Clinical Records Management</p>
        </div>
        <div class="auth-body">
            <form id="loginForm">
                <div id="alertContainer"></div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required
                               oninput="this.value = this.value.replace(/\s/g, '')">
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>
        </div>
        <div class="auth-footer">
            <p class="mb-0 small text-muted">Don't have an account? <a href="register.html" class="fw-bold text-decoration-none ms-1">Register as Patient</a></p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/config.js?v=1.1"></script>
    <script src="js/api.js?v=1.1"></script>
    <script src="js/utils.js?v=1.1"></script>
    <script src="js/auth.js?v=1.1"></script>
    <script>
        // Handle back button - detect if page is loaded from browser cache
        window.addEventListener('pageshow', function(event) {
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                if (Auth.isLoggedIn()) {
                    Auth.redirectToDashboard();
                } else {
                    window.location.reload();
                }
            }
        });

        // Check if already logged in
        if (Auth.isLoggedIn()) {
            Auth.redirectToDashboard();
        }

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });

        // Handle Login Form Submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertContainer = document.getElementById('alertContainer');
            const loginBtn = document.getElementById('loginBtn');

            alertContainer.innerHTML = '';

            if (!email || !password) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>Please enter both email and password.
                    </div>
                `;
                return;
            }

            Utils.setButtonLoading(loginBtn, true);

            try {
                const loginResult = await Auth.login(email, password);

                if (loginResult.success) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-success">
                            <i class="bi bi-check-circle me-2"></i>Login successful! Redirecting...
                        </div>
                    `;

                    setTimeout(() => {
                        if (loginResult.isFirstLogin) {
                            window.location.href = 'pages/change-password.html';
                        } else {
                            Auth.redirectToDashboard();
                        }
                    }, 150);
                } else {
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            ${loginResult.message || 'Invalid email or password.'}
                        </div>
                    `;
                    Utils.setButtonLoading(loginBtn, false);
                }
            } catch (error) {
                console.error('Login error:', error);

                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        ${error.message || 'An error occurred. Please try again.'}
                    </div>
                `;
                Utils.setButtonLoading(loginBtn, false);
            }
        });
    </script>
</body>
</html>
