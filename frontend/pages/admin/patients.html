<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Patients - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
    <link href="../../css/dashboard.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header"><i class="bi bi-hospital logo-icon"></i><h4>Patient Care System</h4></div>
            <ul class="sidebar-menu">
                <li class="menu-section">Administration</li>
                <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li><a href="users.html"><i class="bi bi-people"></i> User Management</a></li>
                <li><a href="create-user.html"><i class="bi bi-person-plus"></i> Create User</a></li>
                <li class="menu-section">System Overview</li>
                <li><a href="patients.html" class="active"><i class="bi bi-person-badge"></i> Patients</a></li>
                <li><a href="appointments.html"><i class="bi bi-calendar-check"></i> Appointments</a></li>
                <li><a href="prescriptions.html"><i class="bi bi-capsule"></i> Prescriptions</a></li>
                <li><a href="invoices.html"><i class="bi bi-receipt"></i> Invoices</a></li>
            </ul>
            <div class="sidebar-footer"><button class="logout-btn" onclick="handleLogout()"><i class="bi bi-box-arrow-left"></i> Logout</button></div>
        </nav>
        <main class="main-content">
            <header class="top-navbar">
                <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                <h1 class="page-title">All Patients</h1>
                <div class="navbar-right"></div>
            </header>
            <div class="page-content">
                <div class="filters-section">
                    <div class="row g-3">
                        <div class="col-md-8"><input type="text" class="form-control" id="searchInput" placeholder="Search patients..."></div>
                        <div class="col-md-4"><button class="btn btn-primary" onclick="searchPatients()">Search</button><button class="btn btn-outline-secondary ms-2" onclick="loadPatients()">Reset</button></div>
                    </div>
                </div>
                <div class="data-card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead><tr><th>MRN</th><th>Name</th><th>DOB</th><th>Gender</th><th>Contact</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
                                <tbody id="dataTable"><tr><td colspan="8" class="text-center py-4"><div class="spinner-border text-primary"></div></td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        if (!Auth.requireRole([CONFIG.ROLES.ADMIN])) window.location.href = '../../index.html';
        let allData = [];
        document.addEventListener('DOMContentLoaded', async () => {
            await loadPatients();
            document.getElementById('searchInput').addEventListener('keypress', e => { if(e.key==='Enter') searchPatients(); });
        });
        async function loadPatients() {
            try {
                allData = await PatientAPI.getAll();
                displayData(allData);
            } catch(e) { document.getElementById('dataTable').innerHTML = `<tr><td colspan="8">${Utils.getErrorState('Failed')}</td></tr>`; }
        }
        async function searchPatients() {
            const q = document.getElementById('searchInput').value.trim();
            if(!q) { displayData(allData); return; }
            try {
                const results = await PatientAPI.search(q);
                displayData(results);
            } catch(e) { displayData([]); }
        }
        function displayData(items) {
            const tbody = document.getElementById('dataTable');
            if(!items.length) { tbody.innerHTML = `<tr><td colspan="8">${Utils.getEmptyState('No patients')}</td></tr>`; return; }
            tbody.innerHTML = items.map(p => {
                // Escape special characters in name for safe use in onclick
                const safeName = (p.fullName || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                return `<tr>
                <td><code>${p.mrn||'N/A'}</code></td>
                <td><strong>${Utils.escapeHtml(p.fullName)}</strong></td>
                <td>${Utils.formatDateDisplay(p.dateOfBirth)}</td>
                <td>${p.gender||'-'}</td>
                <td>${p.contactNumber||'-'}</td>
                <td>${p.email||'-'}</td>
                <td>${p.active !== false ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>'}</td>
                <td>
                    ${p.active !== false ?
                        `<button class="btn btn-sm btn-outline-warning me-1" onclick="deactivatePatient(${p.patientId})" title="Deactivate"><i class="bi bi-pause-circle"></i></button>` :
                        `<button class="btn btn-sm btn-outline-success me-1" onclick="activatePatient(${p.patientId})" title="Activate"><i class="bi bi-play-circle"></i></button>`
                    }
                    <button class="btn btn-sm btn-outline-danger" onclick="deletePatient(${p.patientId}, '${safeName}')" title="Delete Patient"><i class="bi bi-trash"></i></button>
                </td>
            </tr>`;
            }).join('');
        }
        async function deactivatePatient(patientId) {
            if (!await Utils.confirm('Deactivate Patient', 'This patient will be marked as inactive. Continue?')) return;
            try {
                await PatientAPI.deactivate(patientId);
                Utils.showToast('Patient deactivated', 'success');
                await loadPatients();
            } catch (error) {
                Utils.showToast(Utils.extractErrorMessage(error, 'Failed to deactivate'), 'error');
            }
        }
        async function activatePatient(patientId) {
            try {
                await PatientAPI.activate(patientId);
                Utils.showToast('Patient activated', 'success');
                await loadPatients();
            } catch (error) {
                Utils.showToast(Utils.extractErrorMessage(error, 'Failed to activate'), 'error');
            }
        }
        async function deletePatient(patientId, patientName) {
            if (!await Utils.confirm('Delete Patient', `Are you sure you want to permanently delete "${patientName}"? This action cannot be undone.`)) return;
            try {
                await PatientAPI.delete(patientId);
                Utils.showToast('Patient deleted successfully', 'success');
                await loadPatients();
            } catch (error) {
                console.error('Delete patient error:', error);
                const errorMessage = Utils.extractErrorMessage(error, 'Failed to delete patient. The patient may have associated records.');
                Utils.showToast(errorMessage, 'error');
            }
        }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('show'); document.getElementById('sidebarOverlay').classList.toggle('show'); }
        function handleLogout() { Auth.logout(); window.location.href = '../../index.html'; }
    </script>
</body>
</html>
