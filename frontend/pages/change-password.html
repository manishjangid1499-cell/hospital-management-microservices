<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Patient Care System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .change-password-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 480px;
            width: 100%;
            padding: 35px;
        }
        .header-icon {
            width: 60px;
            height: 60px;
            background: #e7f1ff;
            color: #0d6efd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 15px auto;
        }
    </style>
</head>
<body>
    <div class="change-password-card">
        <div class="text-center mb-4">
            <div class="header-icon">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Change Password</h3>
            <p class="text-muted small">For security reasons, you must change your temporary password before accessing the system.</p>
        </div>

        <div id="alertContainer"></div>

        <form id="changePasswordForm">
            <div class="mb-3">
                <label for="currentPassword" class="form-label font-weight-bold">Current / Temporary Password <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control" id="currentPassword" placeholder="Enter temporary password" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="newPassword" class="form-label font-weight-bold">New Password <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="newPassword" placeholder="Minimum 6 characters" minlength="6" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label font-weight-bold">Confirm New Password <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-check-circle"></i></span>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter new password" minlength="6" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="submitBtn">
                <i class="bi bi-shield-check me-2"></i>Update Password & Continue
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const currentPassword = document.getElementById('currentPassword').value.trim();
            const newPassword = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            const alertContainer = document.getElementById('alertContainer');
            const btn = document.getElementById('submitBtn');

            alertContainer.innerHTML = '';

            if (newPassword !== confirmPassword) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger py-2 small">
                        <i class="bi bi-exclamation-triangle me-2"></i>New password and confirm password do not match.
                    </div>
                `;
                return;
            }

            if (newPassword === currentPassword) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger py-2 small">
                        <i class="bi bi-exclamation-triangle me-2"></i>New password cannot be the same as your temporary password.
                    </div>
                `;
                return;
            }

            Utils.setButtonLoading(btn, true);

            try {
                await AuthAPI.changePassword({
                    currentPassword: currentPassword,
                    newPassword: newPassword,
                    confirmPassword: confirmPassword
                });

                // Update session state
                const user = Auth.getUser();
                if (user) {
                    user.isFirstLogin = false;
                    localStorage.setItem(CONFIG.USER_KEY, JSON.stringify(user));
                }

                alertContainer.innerHTML = `
                    <div class="alert alert-success py-2 small">
                        <i class="bi bi-check-circle me-2"></i>Password changed successfully! Redirecting...
                    </div>
                `;

                setTimeout(() => {
                    Auth.redirectToDashboard();
                }, 1200);

            } catch (error) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger py-2 small">
                        <i class="bi bi-exclamation-triangle me-2"></i>${error.message || 'Failed to change password'}
                    </div>
                `;
            } finally {
                Utils.setButtonLoading(btn, false);
            }
        });
    </script>
</body>
</html>
