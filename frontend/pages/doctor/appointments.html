<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Doctor Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
    <link href="../../css/dashboard.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="bi bi-hospital logo-icon"></i>
                <h4>Patient Care System</h4>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-section">Main Menu</li>
                <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li><a href="appointments.html" class="active"><i class="bi bi-calendar-check"></i> Appointments</a></li>
                <li class="menu-section">Clinical</li>
                <li><a href="create-encounter.html"><i class="bi bi-file-medical"></i> Create Encounter</a></li>
                <li><a href="prescribe.html"><i class="bi bi-capsule"></i> Prescribe</a></li>
                <li class="menu-section">Settings</li>
                <li><a href="schedule.html"><i class="bi bi-clock"></i> My Schedule</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="handleLogout()">
                    <i class="bi bi-box-arrow-left"></i> Logout
                </button>
            </div>
        </nav>

        <main class="main-content">
            <header class="top-navbar">
                <button class="sidebar-toggle" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="page-title">My Appointments</h1>
                <div class="navbar-right"></div>
            </header>

            <div class="page-content">
                <!-- Filters -->
                <div class="filters-section">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label">Filter by Date</label>
                            <input type="date" class="form-control" id="filterDate">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="filterStatus">
                                <option value="">All Statuses</option>
                                <option value="BOOKED">Booked</option>
                                <option value="COMPLETED">Completed</option>
                                <option value="CANCELLED">Cancelled</option>
                                <option value="NO_SHOW">No Show</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-primary" onclick="applyFilters()">
                                <i class="bi bi-funnel me-2"></i>Apply Filters
                            </button>
                            <button class="btn btn-outline-secondary" onclick="clearFilters()">Clear</button>
                        </div>
                    </div>
                </div>

                <!-- Appointments Table -->
                <div class="data-card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Time</th>
                                        <th>Patient</th>
                                        <th>MRN</th>
                                        <th>Reason</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="appointmentsTableBody">
                                    <tr>
                                        <td colspan="7" class="text-center py-4">
                                            <div class="spinner-border text-primary"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Update Status Modal -->
    <div class="modal fade" id="updateStatusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Appointment Status</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="updateAppointmentId">
                    <div class="mb-3">
                        <label class="form-label">New Status</label>
                        <select class="form-select" id="newStatus">
                            <option value="BOOKED">Booked</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="CANCELLED">Cancelled</option>
                            <option value="NO_SHOW">No Show</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateStatus()">Update</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        if (!Auth.requireRole([CONFIG.ROLES.DOCTOR])) {
            window.location.href = '../../index.html';
        }

        const doctorId = Auth.getUserId();
        let allAppointments = [];
        let patients = {};

        document.addEventListener('DOMContentLoaded', async function() {
            document.getElementById('filterDate').value = Utils.getToday();
            await loadAppointments();
        });

        async function loadAppointments() {
            try {
                allAppointments = await AppointmentAPI.getByDoctor(doctorId);
                await loadPatientDetails(allAppointments);
                applyFilters();
            } catch (error) {
                document.getElementById('appointmentsTableBody').innerHTML = `
                    <tr><td colspan="7">${Utils.getErrorState('Failed to load appointments')}</td></tr>
                `;
            }
        }

        async function loadPatientDetails(appointments) {
            const patientIds = [...new Set(appointments.map(a => a.patientId))];
            for (const pid of patientIds) {
                if (!patients[pid]) {
                    try {
                        patients[pid] = await PatientAPI.getById(pid);
                    } catch (e) {
                        patients[pid] = { fullName: 'Unknown', mrn: 'N/A' };
                    }
                }
            }
        }

        function applyFilters() {
            const dateFilter = document.getElementById('filterDate').value;
            const statusFilter = document.getElementById('filterStatus').value;

            let filtered = [...allAppointments];

            if (dateFilter) {
                filtered = filtered.filter(a => a.appointmentDate === dateFilter);
            }

            if (statusFilter) {
                filtered = filtered.filter(a => a.appointmentStatus === statusFilter);
            }

            // Sort by date and time
            filtered.sort((a, b) => {
                const dateCompare = b.appointmentDate.localeCompare(a.appointmentDate);
                if (dateCompare !== 0) return dateCompare;
                return a.appointmentTime.localeCompare(b.appointmentTime);
            });

            displayAppointments(filtered);
        }

        function clearFilters() {
            document.getElementById('filterDate').value = '';
            document.getElementById('filterStatus').value = '';
            displayAppointments(allAppointments);
        }

        function displayAppointments(appointments) {
            const tbody = document.getElementById('appointmentsTableBody');

            if (appointments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7">${Utils.getEmptyState('No appointments found', 'bi-calendar-x')}</td></tr>`;
                return;
            }

            tbody.innerHTML = appointments.map(apt => {
                const patient = patients[apt.patientId] || { fullName: 'Unknown', mrn: 'N/A' };

                return `
                    <tr>
                        <td><strong>${Utils.formatDateDisplay(apt.appointmentDate)}</strong></td>
                        <td>${Utils.formatTime(apt.appointmentTime)}</td>
                        <td>${patient.fullName}</td>
                        <td><code>${patient.mrn || 'N/A'}</code></td>
                        <td>${apt.reasonForVisit || '-'}</td>
                        <td>${Utils.getStatusBadge(apt.appointmentStatus)}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="openUpdateStatus(${apt.appointmentId}, '${apt.appointmentStatus}')" title="Update Status">
                                <i class="bi bi-pencil"></i>
                            </button>
                            ${apt.appointmentStatus === 'BOOKED' ? `
                                <a href="create-encounter.html?patientId=${apt.patientId}&appointmentId=${apt.appointmentId}" class="btn btn-sm btn-outline-success me-1" title="Create Encounter">
                                    <i class="bi bi-file-medical"></i>
                                </a>
                                <a href="prescribe.html?patientId=${apt.patientId}" class="btn btn-sm btn-outline-warning" title="Prescribe">
                                    <i class="bi bi-capsule"></i>
                                </a>
                            ` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function openUpdateStatus(appointmentId, currentStatus) {
            document.getElementById('updateAppointmentId').value = appointmentId;
            document.getElementById('newStatus').value = currentStatus;
            new bootstrap.Modal(document.getElementById('updateStatusModal')).show();
        }

        async function updateStatus() {
            const appointmentId = document.getElementById('updateAppointmentId').value;
            const newStatus = document.getElementById('newStatus').value;

            try {
                await AppointmentAPI.updateStatus(appointmentId, newStatus);
                Utils.showToast('Status updated successfully', 'success');
                bootstrap.Modal.getInstance(document.getElementById('updateStatusModal')).hide();
                await loadAppointments();
            } catch (error) {
                Utils.showToast(error.message || 'Failed to update status', 'error');
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }

        function handleLogout() {
            Auth.logout();
            window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
