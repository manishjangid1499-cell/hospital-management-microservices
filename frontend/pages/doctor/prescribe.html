<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prescribe Medication - Doctor Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
    <link href="../../css/dashboard.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="bi bi-hospital logo-icon"></i>
                <h4>Patient Care System</h4>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-section">Main Menu</li>
                <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li><a href="appointments.html"><i class="bi bi-calendar-check"></i> Appointments</a></li>
                <li class="menu-section">Clinical</li>
                <li><a href="create-encounter.html"><i class="bi bi-file-medical"></i> Create Encounter</a></li>
                <li><a href="prescribe.html" class="active"><i class="bi bi-capsule"></i> Prescribe</a></li>
                <li class="menu-section">Settings</li>
                <li><a href="schedule.html"><i class="bi bi-clock"></i> My Schedule</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="handleLogout()">
                    <i class="bi bi-box-arrow-left"></i> Logout
                </button>
            </div>
        </nav>

        <main class="main-content">
            <header class="top-navbar">
                <button class="sidebar-toggle" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="page-title">Prescribe Medication</h1>
                <div class="navbar-right"></div>
            </header>

            <div class="page-content">
                <div class="row">
                    <!-- Patient Selection -->
                    <div class="col-lg-4 mb-4">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0"><i class="bi bi-person me-2"></i>Select Patient</h5>
                            </div>
                            <div class="card-body">
                                <!-- MRN Lookup -->
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Enter MRN</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="mrnInput" placeholder="Enter patient MRN...">
                                        <button class="btn btn-primary" type="button" onclick="lookupByMRN()">
                                            <i class="bi bi-search"></i> Find
                                        </button>
                                    </div>
                                    <div id="mrnError" class="text-danger small mt-1 d-none"></div>
                                </div>

                                <div id="selectedPatientInfo" class="d-none mt-3">
                                    <hr>
                                    <h6>Selected Patient</h6>
                                    <div id="patientDetails"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Prescription Form -->
                    <div class="col-lg-8 mb-4">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0"><i class="bi bi-capsule me-2"></i>New Prescription</h5>
                                <button type="button" class="btn btn-sm btn-outline-primary" onclick="addMedicationRow()">
                                    <i class="bi bi-plus-lg me-1"></i>Add Medication
                                </button>
                            </div>
                            <div class="card-body">
                                <form id="prescriptionForm">
                                    <div id="alertContainer"></div>
                                    <input type="hidden" id="patientId">

                                    <div id="medicationsContainer">
                                        <!-- Medication rows will be added here -->
                                    </div>

                                    <div class="mt-4">
                                        <button type="submit" class="btn btn-primary" id="saveBtn" disabled>
                                            <i class="bi bi-check-lg me-2"></i>Save Prescriptions
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <!-- Recent Prescriptions -->
                        <div class="card mt-4" id="recentPrescriptionsCard">
                            <div class="card-header">
                                <h5 class="mb-0"><i class="bi bi-clock-history me-2"></i>Patient's Recent Prescriptions</h5>
                            </div>
                            <div class="card-body p-0">
                                <div id="recentPrescriptions" class="p-3 text-muted text-center">
                                    Select a patient to view their prescriptions
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        if (!Auth.requireRole([CONFIG.ROLES.DOCTOR])) {
            window.location.href = '../../index.html';
        }

        const doctorId = Auth.getUserId();
        let medications = [];
        let medicationRowCount = 0;
        let currentRecordId = null;

        document.addEventListener('DOMContentLoaded', async function() {
            // Load medications list
            try {
                medications = await PharmacyAPI.getAllMedications();
            } catch (e) {
                console.log('Could not load medications list');
            }

            // Check URL params
            const params = Utils.getUrlParams();
            if (params.recordId) {
                currentRecordId = parseInt(params.recordId);
            }
            if (params.patientId) {
                await loadPatientById(params.patientId);
            }

            // Add first medication row
            addMedicationRow();

            document.getElementById('mrnInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    lookupByMRN();
                }
            });

            document.getElementById('prescriptionForm').addEventListener('submit', handleSubmit);
        });

        async function lookupByMRN() {
            const mrn = document.getElementById('mrnInput').value.trim();
            const errorDiv = document.getElementById('mrnError');
            errorDiv.classList.add('d-none');

            if (!mrn) {
                errorDiv.textContent = 'Please enter an MRN';
                errorDiv.classList.remove('d-none');
                return;
            }

            try {
                const patient = await PatientAPI.getByMrn(mrn);
                if (patient) {
                    displaySelectedPatient(patient);
                    await loadRecentPrescriptions(patient.patientId);
                    errorDiv.classList.add('d-none');
                } else {
                    errorDiv.textContent = 'No patient found with this MRN';
                    errorDiv.classList.remove('d-none');
                }
            } catch (error) {
                errorDiv.textContent = 'No patient found with this MRN';
                errorDiv.classList.remove('d-none');
            }
        }

        function addMedicationRow() {
            medicationRowCount++;
            const container = document.getElementById('medicationsContainer');

            let medicationOptions = '<option value="">Select or type medication...</option>';
            medications.forEach(m => {
                medicationOptions += `<option value="${m.name}">${m.name} (${m.strength || ''})</option>`;
            });

            const rowHtml = `
                <div class="medication-row border rounded p-3 mb-3" id="medRow${medicationRowCount}">
                    <div class="d-flex justify-content-between mb-2">
                        <h6 class="mb-0">Medication #${medicationRowCount}</h6>
                        ${medicationRowCount > 1 ? `<button type="button" class="btn btn-sm btn-outline-danger" onclick="removeMedicationRow(${medicationRowCount})"><i class="bi bi-trash"></i></button>` : ''}
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Medication Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control med-name" list="medList${medicationRowCount}" placeholder="Enter medication name" required>
                            <datalist id="medList${medicationRowCount}">${medicationOptions}</datalist>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Dosage <span class="text-danger">*</span></label>
                            <input type="text" class="form-control med-dosage" placeholder="e.g., 500mg" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Frequency <span class="text-danger">*</span></label>
                            <select class="form-select med-frequency" required>
                                <option value="">Select...</option>
                                <option value="Once daily">Once daily</option>
                                <option value="Twice daily">Twice daily</option>
                                <option value="Three times daily">Three times daily</option>
                                <option value="Four times daily">Four times daily</option>
                                <option value="Every 4 hours">Every 4 hours</option>
                                <option value="Every 6 hours">Every 6 hours</option>
                                <option value="Every 8 hours">Every 8 hours</option>
                                <option value="As needed">As needed</option>
                                <option value="At bedtime">At bedtime</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Duration</label>
                            <input type="text" class="form-control med-duration" placeholder="e.g., 7 days">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Quantity</label>
                            <input type="number" class="form-control med-quantity" placeholder="e.g., 30" min="1">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Instructions</label>
                            <input type="text" class="form-control med-instructions" placeholder="Special instructions (e.g., Take with food)">
                        </div>
                    </div>
                </div>
            `;

            container.insertAdjacentHTML('beforeend', rowHtml);
        }

        function removeMedicationRow(rowNum) {
            document.getElementById(`medRow${rowNum}`).remove();
        }

        async function loadPatientById(patientId) {
            try {
                const patient = await PatientAPI.getById(patientId);
                displaySelectedPatient(patient);
                await loadRecentPrescriptions(patientId);
            } catch (error) {
                Utils.showToast('Failed to load patient', 'error');
            }
        }

        function displaySelectedPatient(patient) {
            document.getElementById('patientId').value = patient.patientId;
            document.getElementById('saveBtn').disabled = false;
            document.getElementById('selectedPatientInfo').classList.remove('d-none');
            document.getElementById('mrnInput').value = patient.mrn || '';

            document.getElementById('patientDetails').innerHTML = `
                <div class="bg-light p-3 rounded">
                    <strong>${patient.fullName}</strong><br>
                    <small>MRN: <code>${patient.mrn || 'N/A'}</code></small><br>
                    <small>DOB: ${Utils.formatDateDisplay(patient.dateOfBirth)}</small><br>
                    ${patient.allergies ? `<div class="alert alert-danger py-1 px-2 mt-2 mb-0"><small><strong>Allergies:</strong> ${patient.allergies}</small></div>` : ''}
                </div>
            `;
        }

        async function loadRecentPrescriptions(patientId) {
            const container = document.getElementById('recentPrescriptions');
            try {
                const prescriptions = await PharmacyAPI.getPatientPrescriptions(patientId);
                if (prescriptions.length === 0) {
                    container.innerHTML = '<p class="text-muted mb-0">No previous prescriptions</p>';
                } else {
                    let html = '<div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>Medication</th><th>Dosage</th><th>Status</th></tr></thead><tbody>';
                    prescriptions.slice(0, 5).forEach(p => {
                        html += `<tr><td>${p.medicationName}</td><td>${p.dosage}</td><td>${Utils.getStatusBadge(p.dispenseStatus)}</td></tr>`;
                    });
                    html += '</tbody></table></div>';
                    container.innerHTML = html;
                }
            } catch (e) {
                container.innerHTML = '<p class="text-muted mb-0">Could not load prescriptions</p>';
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const patientId = document.getElementById('patientId').value;
            if (!patientId) {
                Utils.showToast('Please select a patient first', 'warning');
                return;
            }

            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = '';

            if (!currentRecordId) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <strong>Clinical Encounter Required:</strong> You cannot prescribe medicine without creating a Clinical Encounter first. Please create an Encounter from the <a href="create-encounter.html?patientId=${patientId}">Create Encounter</a> page.
                    </div>
                `;
                return;
            }

            const btn = document.getElementById('saveBtn');

            // Collect all medication rows
            const rows = document.querySelectorAll('.medication-row');
            const prescriptions = [];

            rows.forEach(row => {
                const name = row.querySelector('.med-name').value.trim();
                const dosage = row.querySelector('.med-dosage').value.trim();
                const frequency = row.querySelector('.med-frequency').value;

                if (name && dosage && frequency) {
                    prescriptions.push({
                        patientId: parseInt(patientId),
                        doctorId: doctorId,
                        recordId: currentRecordId,
                        medicationName: name,
                        dosage: dosage,
                        frequency: frequency,
                        duration: row.querySelector('.med-duration').value.trim() || null,
                        quantity: parseInt(row.querySelector('.med-quantity').value) || null,
                        instructions: row.querySelector('.med-instructions').value.trim() || null
                    });
                }
            });

            if (prescriptions.length === 0) {
                alertContainer.innerHTML = `
                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Please add at least one medication.
                    </div>
                `;
                return;
            }

            Utils.setButtonLoading(btn, true);

            try {

                // Save all prescriptions
                let successCount = 0;
                for (const prescription of prescriptions) {
                    try {
                        await PharmacyAPI.createPrescription(prescription);
                        successCount++;
                    } catch (e) {
                        console.error('Failed to save prescription:', e);
                    }
                }

                if (successCount === prescriptions.length) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-success">
                            <i class="bi bi-check-circle me-2"></i>
                            ${successCount} prescription(s) saved successfully!
                        </div>
                    `;

                    // Clear form
                    document.getElementById('medicationsContainer').innerHTML = '';
                    medicationRowCount = 0;
                    addMedicationRow();
                    await loadRecentPrescriptions(patientId);
                } else {
                    alertContainer.innerHTML = `
                        <div class="alert alert-warning">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            ${successCount} of ${prescriptions.length} prescriptions saved.
                        </div>
                    `;
                }

            } catch (error) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        ${error.message || 'Failed to save prescriptions'}
                    </div>
                `;
            } finally {
                Utils.setButtonLoading(btn, false);
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }

        function handleLogout() {
            Auth.logout();
            window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
