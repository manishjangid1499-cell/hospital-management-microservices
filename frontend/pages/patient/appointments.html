<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments - Patient Care System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
    <link href="../../css/dashboard.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="bi bi-hospital logo-icon"></i>
                <h4>Patient Care System</h4>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-section">Main Menu</li>
                <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li><a href="appointments.html" class="active"><i class="bi bi-calendar-check"></i> My Appointments</a></li>
                <li><a href="medical-records.html"><i class="bi bi-file-medical"></i> Medical Records</a></li>
                <li><a href="prescriptions.html"><i class="bi bi-capsule"></i> Prescriptions</a></li>
                <li><a href="invoices.html"><i class="bi bi-receipt"></i> Bills & Invoices</a></li>
                <li class="menu-section">Account</li>
                <li><a href="profile.html"><i class="bi bi-person-circle"></i> My Profile</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="handleLogout()">
                    <i class="bi bi-box-arrow-left"></i> Logout
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-navbar">
                <button class="sidebar-toggle" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="page-title">My Appointments</h1>
                <div class="navbar-right">
                    <!-- Appointments are booked by receptionist -->
                </div>
            </header>

            <div class="page-content">
                <!-- Filter Tabs -->
                <ul class="nav nav-tabs mb-4" id="appointmentTabs">
                    <li class="nav-item">
                        <a class="nav-link active" data-filter="all" href="#">All</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-filter="BOOKED" href="#">Upcoming</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-filter="COMPLETED" href="#">Completed</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-filter="CANCELLED" href="#">Cancelled</a>
                    </li>
                </ul>

                <!-- Appointments List -->
                <div class="data-card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Time</th>
                                        <th>Doctor</th>
                                        <th>Reason</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="appointmentsTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center py-4">
                                            <div class="spinner-border text-primary"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>


    <!-- Reschedule feature removed from patient dashboard -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        if (!Auth.requireRole([CONFIG.ROLES.PATIENT])) {
            window.location.href = '../../index.html';
        }

        let allAppointments = [];
        let doctorsMap = {};
        let patientId = localStorage.getItem('patientId');

        document.addEventListener('DOMContentLoaded', async function() {

            // Load patient ID if not available
            if (!patientId) {
                try {
                    const patient = await PatientAPI.getByUserId(Auth.getUserId());
                    patientId = patient.patientId;
                    localStorage.setItem('patientId', patientId);
                } catch (error) {
                    Utils.showToast('Please complete your profile first', 'warning');
                    return;
                }
            }

            await loadDoctors();
            await loadAppointments();
            setupEventListeners();
        });

        async function loadDoctors() {
            try {
                const doctors = await AuthAPI.getUsersByRole('DOCTOR');
                doctors.forEach(doc => {
                    doctorsMap[doc.id || doc.userId] = doc;
                });
            } catch (error) {
                console.error('Error loading doctors:', error);
            }
        }

        async function loadAppointments() {
            try {
                allAppointments = await AppointmentAPI.getByPatient(patientId);
                displayAppointments(allAppointments);
            } catch (error) {
                console.error('Error loading appointments:', error);
                document.getElementById('appointmentsTableBody').innerHTML = `
                    <tr><td colspan="6">${Utils.getErrorState('Failed to load appointments')}</td></tr>
                `;
            }
        }

        function displayAppointments(appointments) {
            const tbody = document.getElementById('appointmentsTableBody');

            if (appointments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6">${Utils.getEmptyState('No appointments found', 'bi-calendar-x')}</td></tr>`;
                return;
            }

            tbody.innerHTML = appointments.map(apt => {
                const doctor = doctorsMap[apt.doctorId];
                const doctorName = doctor ? 'Dr. ' + (doctor.fullName || '') : (apt.doctorName || 'Doctor');
                const canCancel = apt.appointmentStatus === 'BOOKED';

                return `
                    <tr>
                        <td><strong>${Utils.formatDateDisplay(apt.appointmentDate)}</strong></td>
                        <td>${Utils.formatTime(apt.appointmentTime)}</td>
                        <td>${doctorName}</td>
                        <td>${apt.reasonForVisit || '-'}</td>
                        <td>${Utils.getStatusBadge(apt.appointmentStatus)}</td>
                        <td>
                            ${canCancel ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelAppointment(${apt.appointmentId})"><i class="bi bi-x-circle"></i></button>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function setupEventListeners() {
            // Tab filtering
            document.querySelectorAll('#appointmentTabs .nav-link').forEach(tab => {
                tab.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.querySelectorAll('#appointmentTabs .nav-link').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');

                    const filter = this.dataset.filter;
                    if (filter === 'all') {
                        displayAppointments(allAppointments);
                    } else {
                        displayAppointments(allAppointments.filter(a => a.appointmentStatus === filter));
                    }
                });
            });
        }


        // Reschedule functionality removed for patient

        async function cancelAppointment(appointmentId) {
            const confirmed = await Utils.confirm('Cancel Appointment', 'Are you sure you want to cancel this appointment?');
            if (!confirmed) return;

            try {
                await AppointmentAPI.cancel(appointmentId);
                Utils.showToast('Appointment cancelled', 'success');
                await loadAppointments();
            } catch (error) {
                Utils.showToast(error.message || 'Failed to cancel appointment', 'error');
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }

        function handleLogout() {
            Auth.logout();
            window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
