<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Records - Patient Care System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
    <link href="../../css/dashboard.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="bi bi-hospital logo-icon"></i>
                <h4>Patient Care System</h4>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-section">Main Menu</li>
                <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li><a href="appointments.html"><i class="bi bi-calendar-check"></i> My Appointments</a></li>
                <li><a href="medical-records.html" class="active"><i class="bi bi-file-medical"></i> Medical Records</a></li>
                <li><a href="prescriptions.html"><i class="bi bi-capsule"></i> Prescriptions</a></li>
                <li><a href="invoices.html"><i class="bi bi-receipt"></i> Bills & Invoices</a></li>
                <li class="menu-section">Account</li>
                <li><a href="profile.html"><i class="bi bi-person-circle"></i> My Profile</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="handleLogout()">
                    <i class="bi bi-box-arrow-left"></i> Logout
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-navbar">
                <button class="sidebar-toggle" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="page-title">Medical Records</h1>
                <div class="navbar-right"></div>
            </header>

            <div class="page-content">
                <div class="alert alert-info mb-4">
                    <i class="bi bi-info-circle me-2"></i>
                    Your complete medical history and clinical encounters are listed below.
                </div>

                <!-- Records List -->
                <div id="recordsContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- View Record Modal -->
    <div class="modal fade" id="viewRecordModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-file-medical me-2"></i>Clinical Record Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="recordDetails">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        if (!Auth.requireRole([CONFIG.ROLES.PATIENT])) {
            window.location.href = '../../index.html';
        }

        let patientId = localStorage.getItem('patientId');

        document.addEventListener('DOMContentLoaded', async function() {
            if (!patientId) {
                try {
                    const patient = await PatientAPI.getByUserId(Auth.getUserId());
                    patientId = patient.patientId;
                    localStorage.setItem('patientId', patientId);
                } catch (error) {
                    document.getElementById('recordsContainer').innerHTML = Utils.getEmptyState('Please complete your profile first', 'bi-person-x');
                    return;
                }
            }
            await loadRecords();
        });

        async function loadRecords() {
            try {
                const records = await EhrAPI.getPatientHistory(patientId);
                displayRecords(records);
            } catch (error) {
                document.getElementById('recordsContainer').innerHTML = Utils.getEmptyState('No medical records found', 'bi-file-medical');
            }
        }

        function displayRecords(records) {
            const container = document.getElementById('recordsContainer');

            if (!records || records.length === 0) {
                container.innerHTML = Utils.getEmptyState('No medical records found', 'bi-file-medical');
                return;
            }

            let html = '<div class="row g-4">';
            records.forEach(record => {
                html += `
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-calendar me-2"></i>${Utils.formatDateDisplay(record.encounterDate)}</span>
                                <span class="badge bg-primary">${record.diagnosisCode || 'N/A'}</span>
                            </div>
                            <div class="card-body">
                                <h6 class="card-subtitle mb-2 text-muted">Diagnosis Code: ${record.diagnosisCode || 'Not specified'}</h6>
                                <p class="card-text">${Utils.truncate(record.clinicalNotes, 150) || 'No notes available'}</p>
                                ${record.vitalsSummary ? `<p class="text-muted small"><strong>Vitals:</strong> ${record.vitalsSummary}</p>` : ''}
                            </div>
                            <div class="card-footer bg-white">
                                <button class="btn btn-sm btn-outline-primary" onclick="viewRecord(${JSON.stringify(record).replace(/"/g, '&quot;')})">
                                    <i class="bi bi-eye me-1"></i>View Details
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function viewRecord(record) {
            const details = document.getElementById('recordDetails');
            details.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <div class="detail-row">
                            <span class="detail-label">Encounter Date</span>
                            <span class="detail-value">${Utils.formatDateDisplay(record.encounterDate)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Diagnosis Code</span>
                            <span class="detail-value">${record.diagnosisCode || 'N/A'}</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="detail-row">
                            <span class="detail-label">Record ID</span>
                            <span class="detail-value">#${record.recordId}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Vitals</span>
                            <span class="detail-value">${record.vitalsSummary || 'Not recorded'}</span>
                        </div>
                    </div>
                </div>
                <hr>
                <h6>Clinical Notes</h6>
                <p class="bg-light p-3 rounded">${record.clinicalNotes || 'No clinical notes available.'}</p>
            `;
            new bootstrap.Modal(document.getElementById('viewRecordModal')).show();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }

        function handleLogout() {
            Auth.logout();
            window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
