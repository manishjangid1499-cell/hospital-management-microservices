<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Patient Care System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
    <link href="../../css/dashboard.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="bi bi-hospital logo-icon"></i>
                <h4>Patient Care System</h4>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-section">Main Menu</li>
                <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li><a href="appointments.html"><i class="bi bi-calendar-check"></i> My Appointments</a></li>
                <li><a href="medical-records.html"><i class="bi bi-file-medical"></i> Medical Records</a></li>
                <li><a href="prescriptions.html"><i class="bi bi-capsule"></i> Prescriptions</a></li>
                <li><a href="invoices.html"><i class="bi bi-receipt"></i> Bills & Invoices</a></li>
                <li class="menu-section">Account</li>
                <li><a href="profile.html" class="active"><i class="bi bi-person-circle"></i> My Profile</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="handleLogout()">
                    <i class="bi bi-box-arrow-left"></i> Logout
                </button>
            </div>
        </nav>

        <main class="main-content">
            <header class="top-navbar">
                <button class="sidebar-toggle" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="page-title">My Profile</h1>
                <div class="navbar-right"></div>
            </header>

            <div class="page-content">
                <div class="row">
                    <!-- Profile Card -->
                    <div class="col-lg-4 mb-4">
                        <div class="profile-card">
                            <div class="profile-header">
                                <div class="profile-avatar" id="profileAvatar">P</div>
                                <h4 id="profileName">Patient Name</h4>
                                <p id="profileMrn">MRN: Loading...</p>
                            </div>
                            <div class="profile-body">
                                <div class="detail-row">
                                    <span class="detail-label"><i class="bi bi-envelope me-2"></i>Email</span>
                                    <span class="detail-value" id="profileEmail">-</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label"><i class="bi bi-telephone me-2"></i>Phone</span>
                                    <span class="detail-value" id="profilePhone">-</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label"><i class="bi bi-calendar me-2"></i>Date of Birth</span>
                                    <span class="detail-value" id="profileDob">-</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label"><i class="bi bi-person me-2"></i>Gender</span>
                                    <span class="detail-value" id="profileGender">-</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Edit Profile Form -->
                    <div class="col-lg-8 mb-4">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Profile</h5>
                            </div>
                            <div class="card-body">
                                <form id="profileForm">
                                    <div id="alertContainer"></div>

                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Full Name <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="fullName" required
                                                   pattern="[A-Za-z\s]+" minlength="3" title="Only letters and spaces, minimum 3 characters">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Date of Birth <span class="text-danger">*</span></label>
                                            <input type="date" class="form-control" id="dateOfBirth" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Gender <span class="text-danger">*</span></label>
                                            <select class="form-select" id="gender" required>
                                                <option value="">Select Gender</option>
                                                <option value="MALE">Male</option>
                                                <option value="FEMALE">Female</option>
                                                <option value="OTHER">Other</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Blood Group</label>
                                            <select class="form-select" id="bloodGroup">
                                                <option value="">Select Blood Group</option>
                                                <option value="A+">A+</option>
                                                <option value="A-">A-</option>
                                                <option value="B+">B+</option>
                                                <option value="B-">B-</option>
                                                <option value="AB+">AB+</option>
                                                <option value="AB-">AB-</option>
                                                <option value="O+">O+</option>
                                                <option value="O-">O-</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Contact Number <span class="text-danger">*</span></label>
                                            <input type="tel" class="form-control" id="contactNumber" required
                                                   pattern="[0-9]{10}" maxlength="10" title="Exactly 10 digits">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Email</label>
                                            <input type="email" class="form-control" id="email" readonly>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Address</label>
                                            <textarea class="form-control" id="address" rows="2" minlength="10" title="Minimum 10 characters"></textarea>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Emergency Contact Name</label>
                                            <input type="text" class="form-control" id="emergencyContactName"
                                                   pattern="[A-Za-z\s]+" minlength="3" title="Only letters and spaces, minimum 3 characters">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Emergency Contact Phone</label>
                                            <input type="tel" class="form-control" id="emergencyContactPhone"
                                                   pattern="[0-9]{10}" maxlength="10" title="Exactly 10 digits">
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Allergies</label>
                                            <textarea class="form-control" id="allergies" rows="2" placeholder="List any known allergies..."></textarea>
                                        </div>
                                    </div>

                                    <div class="mt-4">
                                        <button type="submit" class="btn btn-primary" id="saveBtn">
                                            <i class="bi bi-check-lg me-2"></i>Save Changes
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        if (!Auth.requireRole([CONFIG.ROLES.PATIENT])) {
            window.location.href = '../../index.html';
        }

        let patientId = localStorage.getItem('patientId');
        let patientData = null;

        document.addEventListener('DOMContentLoaded', async function() {
            const user = Auth.getUser();
            document.getElementById('email').value = user.email || '';

            // Set max date for DOB to yesterday (must be in past)
            const today = new Date();
            today.setDate(today.getDate() - 1);
            document.getElementById('dateOfBirth').max = today.toISOString().split('T')[0];

            await loadPatientProfile();

            document.getElementById('profileForm').addEventListener('submit', handleSaveProfile);
        });

        async function loadPatientProfile() {
            try {
                const userId = Auth.getUserId();
                patientData = await PatientAPI.getByUserId(userId);
                patientId = patientData.patientId;
                localStorage.setItem('patientId', patientId);

                populateProfile(patientData);
                populateForm(patientData);
            } catch (error) {
                console.log('Patient profile not found, user needs to complete profile');
                // Pre-fill with auth data
                const user = Auth.getUser();
                document.getElementById('fullName').value = user.fullName || '';
            }
        }

        function populateProfile(patient) {
            document.getElementById('profileAvatar').textContent = (patient.fullName || 'P').charAt(0).toUpperCase();
            document.getElementById('profileName').textContent = patient.fullName || 'Patient';
            document.getElementById('profileMrn').textContent = `MRN: ${patient.mrn || 'Not assigned'}`;
            document.getElementById('profileEmail').textContent = patient.email || '-';
            document.getElementById('profilePhone').textContent = patient.contactNumber || '-';
            document.getElementById('profileDob').textContent = patient.dateOfBirth ? Utils.formatDateDisplay(patient.dateOfBirth) : '-';
            document.getElementById('profileGender').textContent = patient.gender || '-';
        }

        function populateForm(patient) {
            document.getElementById('fullName').value = patient.fullName || '';
            document.getElementById('dateOfBirth').value = patient.dateOfBirth || '';
            document.getElementById('gender').value = patient.gender || '';
            document.getElementById('bloodGroup').value = patient.bloodGroup || '';
            document.getElementById('contactNumber').value = patient.contactNumber || '';
            document.getElementById('email').value = patient.email || '';
            document.getElementById('address').value = patient.address || '';
            document.getElementById('emergencyContactName').value = patient.emergencyContactName || '';
            document.getElementById('emergencyContactPhone').value = patient.emergencyPhone || '';
            document.getElementById('allergies').value = patient.allergies || '';
        }

        async function handleSaveProfile(e) {
            e.preventDefault();

            const btn = document.getElementById('saveBtn');
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = '';

            // Client-side validation for date of birth
            const dobValue = document.getElementById('dateOfBirth').value;
            if (dobValue) {
                const dob = new Date(dobValue);
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                if (dob >= today) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            Date of birth must be in the past
                        </div>
                    `;
                    document.getElementById('dateOfBirth').focus();
                    return;
                }
            }

            // Validate full name
            const fullName = document.getElementById('fullName').value.trim();
            if (!/^[A-Za-z\s]+$/.test(fullName) || fullName.length < 3) {
                alertContainer.innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>Full Name must contain only letters and spaces, minimum 3 characters.</div>`;
                document.getElementById('fullName').focus();
                return;
            }

            // Validate email
            const email = document.getElementById('email').value.trim();
            if (email && !Utils.isValidEmail(email)) {
                alertContainer.innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>Please enter a valid email address (must end with .com).</div>`;
                document.getElementById('email').focus();
                return;
            }

            // Validate contact number
            const contactNumber = document.getElementById('contactNumber').value.trim();
            if (!/^[0-9]{10}$/.test(contactNumber)) {
                alertContainer.innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>Contact Number must be exactly 10 digits.</div>`;
                document.getElementById('contactNumber').focus();
                return;
            }

            // Validate address if provided
            const address = document.getElementById('address').value.trim();
            if (address && address.length < 10) {
                alertContainer.innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>Address must be at least 10 characters.</div>`;
                document.getElementById('address').focus();
                return;
            }

            // Validate emergency contact name if provided
            const emergencyName = document.getElementById('emergencyContactName').value.trim();
            if (emergencyName && (!/^[A-Za-z\s]+$/.test(emergencyName) || emergencyName.length < 3)) {
                alertContainer.innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>Emergency Contact Name must contain only letters and spaces, minimum 3 characters.</div>`;
                document.getElementById('emergencyContactName').focus();
                return;
            }

            // Validate emergency contact phone if provided
            const emergencyPhone = document.getElementById('emergencyContactPhone').value.trim();
            if (emergencyPhone && !/^[0-9]{10}$/.test(emergencyPhone)) {
                alertContainer.innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>Emergency Contact Phone must be exactly 10 digits.</div>`;
                document.getElementById('emergencyContactPhone').focus();
                return;
            }

            const formData = {
                fullName: document.getElementById('fullName').value.trim(),
                dateOfBirth: document.getElementById('dateOfBirth').value,
                gender: document.getElementById('gender').value,
                bloodGroup: document.getElementById('bloodGroup').value,
                contactNumber: document.getElementById('contactNumber').value.trim(),
                email: document.getElementById('email').value.trim(),
                address: document.getElementById('address').value.trim(),
                emergencyContactName: document.getElementById('emergencyContactName').value.trim(),
                emergencyPhone: document.getElementById('emergencyContactPhone').value.trim(),
                allergies: document.getElementById('allergies').value.trim(),
                userId: Auth.getUserId()
            };

            Utils.setButtonLoading(btn, true);

            try {
                let result;
                if (patientId) {
                    // Update existing patient
                    result = await PatientAPI.updateDemographics(patientId, formData);
                } else {
                    // Register new patient
                    result = await PatientAPI.register(formData);
                    patientId = result.patientId;
                    localStorage.setItem('patientId', patientId);
                }

                alertContainer.innerHTML = `
                    <div class="alert alert-success">
                        <i class="bi bi-check-circle me-2"></i>
                        Profile saved successfully!
                    </div>
                `;

                // Reload profile display
                await loadPatientProfile();
            } catch (error) {
                // Extract error message properly
                let errorMessage = 'Failed to save profile';

                if (typeof error === 'string') {
                    errorMessage = error;
                } else if (error && typeof error === 'object') {
                    if (typeof error.message === 'string') {
                        errorMessage = error.message;
                    } else if (typeof error.message === 'object') {
                        // Handle validation errors object (e.g., { dateOfBirth: "must be in past" })
                        const messages = [];
                        for (const [field, msg] of Object.entries(error.message)) {
                            const fieldName = field.replace(/([A-Z])/g, ' $1').toLowerCase();
                            messages.push(`${fieldName}: ${msg}`);
                        }
                        errorMessage = messages.join(', ');
                    } else if (error.errors && Array.isArray(error.errors)) {
                        // Handle array of errors
                        errorMessage = error.errors.map(e => e.message || e).join(', ');
                    }
                }

                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        ${errorMessage}
                    </div>
                `;
            } finally {
                Utils.setButtonLoading(btn, false);
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }

        function handleLogout() {
            Auth.logout();
            window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
