<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prescriptions - Pharmacist Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
    <link href="../../css/dashboard.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="bi bi-hospital logo-icon"></i>
                <h4>Patient Care System</h4>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-section">Main Menu</li>
                <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li><a href="prescriptions.html" class="active"><i class="bi bi-prescription2"></i> Prescriptions</a></li>
                <li><a href="inventory.html"><i class="bi bi-box-seam"></i> Inventory</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="handleLogout()">
                    <i class="bi bi-box-arrow-left"></i> Logout
                </button>
            </div>
        </nav>

        <main class="main-content">
            <header class="top-navbar">
                <button class="sidebar-toggle" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="page-title">Prescriptions</h1>
                <div class="navbar-right"></div>
            </header>

            <div class="page-content">
                <!-- Filter Tabs -->
                <ul class="nav nav-tabs mb-4" id="rxTabs">
                    <li class="nav-item"><a class="nav-link" data-filter="all" href="#">All</a></li>
                    <li class="nav-item"><a class="nav-link active" data-filter="PENDING" href="#">Pending</a></li>
                    <li class="nav-item"><a class="nav-link" data-filter="DISPENSED" href="#">Dispensed</a></li>
                    <li class="nav-item"><a class="nav-link" data-filter="CANCELLED" href="#">Cancelled</a></li>
                </ul>

                <!-- Prescriptions Table -->
                <div class="data-card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Patient</th>
                                        <th>Medication</th>
                                        <th>Dosage</th>
                                        <th>Frequency</th>
                                        <th>Qty</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="rxTable">
                                    <tr><td colspan="8" class="text-center py-4"><div class="spinner-border text-primary"></div></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- View Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Prescription Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detailsContent"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success d-none" id="dispenseFromModal">Dispense</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        if (!Auth.requireRole([CONFIG.ROLES.PHARMACIST])) {
            window.location.href = '../../index.html';
        }

        let allPrescriptions = [];
        let patients = {};
        let currentFilter = 'PENDING';

        document.addEventListener('DOMContentLoaded', async function() {
            // Check URL params
            const params = Utils.getUrlParams();
            if (params.filter === 'pending') {
                currentFilter = 'PENDING';
            }

            await loadPrescriptions();
            setupTabs();
        });

        async function loadPrescriptions() {
            try {
                allPrescriptions = await PharmacyAPI.getAllPrescriptions();
                await loadPatientDetails(allPrescriptions);
                filterPrescriptions(currentFilter);
            } catch (error) {
                document.getElementById('rxTable').innerHTML = `<tr><td colspan="8">${Utils.getErrorState('Failed to load')}</td></tr>`;
            }
        }

        async function loadPatientDetails(prescriptions) {
            const patientIds = [...new Set(prescriptions.map(p => p.patientId))];
            for (const pid of patientIds) {
                if (!patients[pid]) {
                    try {
                        patients[pid] = await PatientAPI.getById(pid);
                    } catch (e) {
                        patients[pid] = { fullName: 'Unknown', mrn: 'N/A' };
                    }
                }
            }
        }

        function setupTabs() {
            document.querySelectorAll('#rxTabs .nav-link').forEach(tab => {
                tab.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.querySelectorAll('#rxTabs .nav-link').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    filterPrescriptions(currentFilter);
                });
            });

            // Set active tab
            document.querySelector(`#rxTabs [data-filter="${currentFilter}"]`).classList.add('active');
        }

        function filterPrescriptions(filter) {
            let filtered = [...allPrescriptions];
            if (filter !== 'all') {
                filtered = filtered.filter(rx => rx.dispenseStatus === filter);
            }
            displayPrescriptions(filtered);
        }

        function displayPrescriptions(prescriptions) {
            const tbody = document.getElementById('rxTable');

            if (prescriptions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8">${Utils.getEmptyState('No prescriptions found', 'bi-prescription2')}</td></tr>`;
                return;
            }

            tbody.innerHTML = prescriptions.map(rx => {
                const patient = patients[rx.patientId] || { fullName: 'Unknown' };
                return `<tr>
                    <td>#${rx.prescriptionId}</td>
                    <td>${patient.fullName}</td>
                    <td><strong>${rx.medicationName}</strong></td>
                    <td>${rx.dosage}</td>
                    <td>${rx.frequency}</td>
                    <td>${rx.quantity || '-'}</td>
                    <td>${Utils.getStatusBadge(rx.dispenseStatus)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="viewDetails(${rx.prescriptionId})"><i class="bi bi-eye"></i></button>
                        ${rx.dispenseStatus === 'PENDING' ? `
                            <button class="btn btn-sm btn-success me-1" onclick="dispense(${rx.prescriptionId})"><i class="bi bi-check-lg"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="cancelRx(${rx.prescriptionId})"><i class="bi bi-x-lg"></i></button>
                        ` : ''}
                    </td>
                </tr>`;
            }).join('');
        }

        async function viewDetails(id) {
            const rx = allPrescriptions.find(r => r.prescriptionId === id);
            if (!rx) return;

            const patient = patients[rx.patientId] || { fullName: 'Unknown', mrn: 'N/A' };

            document.getElementById('detailsContent').innerHTML = `
                <div class="detail-row"><span class="detail-label">Prescription ID</span><span class="detail-value">#${rx.prescriptionId}</span></div>
                <div class="detail-row"><span class="detail-label">Patient</span><span class="detail-value">${patient.fullName} (${patient.mrn})</span></div>
                <div class="detail-row"><span class="detail-label">Medication</span><span class="detail-value">${rx.medicationName}</span></div>
                <div class="detail-row"><span class="detail-label">Dosage</span><span class="detail-value">${rx.dosage}</span></div>
                <div class="detail-row"><span class="detail-label">Frequency</span><span class="detail-value">${rx.frequency}</span></div>
                <div class="detail-row"><span class="detail-label">Duration</span><span class="detail-value">${rx.duration || '-'}</span></div>
                <div class="detail-row"><span class="detail-label">Quantity</span><span class="detail-value">${rx.quantity || '-'}</span></div>
                <div class="detail-row"><span class="detail-label">Instructions</span><span class="detail-value">${rx.instructions || '-'}</span></div>
                <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">${Utils.getStatusBadge(rx.dispenseStatus)}</span></div>
                ${rx.dispensedAt ? `<div class="detail-row"><span class="detail-label">Dispensed At</span><span class="detail-value">${Utils.formatDateDisplay(rx.dispensedAt)}</span></div>` : ''}
            `;

            const dispenseBtn = document.getElementById('dispenseFromModal');
            if (rx.dispenseStatus === 'PENDING') {
                dispenseBtn.classList.remove('d-none');
                dispenseBtn.onclick = () => { dispense(id); bootstrap.Modal.getInstance(document.getElementById('detailsModal')).hide(); };
            } else {
                dispenseBtn.classList.add('d-none');
            }

            new bootstrap.Modal(document.getElementById('detailsModal')).show();
        }

        async function dispense(id) {
            try {
                await PharmacyAPI.dispenseMedication(id, Auth.getUserId());
                Utils.showToast('Medication dispensed!', 'success');
                await loadPrescriptions();
            } catch (error) {
                Utils.showToast(error.message || 'Failed to dispense', 'error');
            }
        }

        async function cancelRx(id) {
            if (!await Utils.confirm('Cancel Prescription', 'Are you sure?')) return;
            try {
                await PharmacyAPI.cancelPrescription(id);
                Utils.showToast('Prescription cancelled', 'success');
                await loadPrescriptions();
            } catch (error) {
                Utils.showToast(error.message || 'Failed', 'error');
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }

        function handleLogout() {
            Auth.logout();
            window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
