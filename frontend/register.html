<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Patient Care Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
    <!-- Inline Critical CSS for back-button cache fix -->
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 0;
        }
        .auth-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
        }
        .auth-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-card fade-in">
        <div class="auth-header">
            <i class="bi bi-person-plus logo-icon"></i>
            <h2>Patient Registration</h2>
            <p>Create your account to get started</p>
        </div>
        <div class="auth-body">
            <form id="registerForm">
                <div id="alertContainer"></div>

                <div class="mb-3">
                    <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required
                               pattern="[A-Za-z\s]+" minlength="3" title="Only letters and spaces, minimum 3 characters">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                        <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number" required
                               pattern="[0-9]{10}" maxlength="10" title="Exactly 10 digits">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Create a password" required minlength="6"
                               oninput="this.value = this.value.replace(/\s/g, '')">
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="form-text">Password must be at least 6 characters long.</div>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required
                               oninput="this.value = this.value.replace(/\s/g, '')">
                    </div>
                </div>

                <div class="alert alert-info small py-2">
                    <i class="bi bi-info-circle me-1"></i>
                    After registration, you can complete your full profile (DOB, address, emergency contacts, etc.) from your Patient Dashboard.
                </div>

                <button type="submit" class="btn btn-primary w-100" id="registerBtn">
                    <i class="bi bi-person-check me-2"></i>Create Account
                </button>
            </form>
        </div>
        <div class="auth-footer">
            <p class="mb-0">Already have an account? <a href="index.html">Sign In</a></p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Handle back button - detect if page is loaded from browser cache
        window.addEventListener('pageshow', function(event) {
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                if (Auth.isLoggedIn()) {
                    Auth.redirectToDashboard();
                } else {
                    window.location.reload();
                }
            }
        });

        // Check if already logged in
        if (Auth.isLoggedIn()) {
            Auth.redirectToDashboard();
        }

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });

        // Registration form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const registerBtn = document.getElementById('registerBtn');
            const alertContainer = document.getElementById('alertContainer');

            // Clear previous alerts
            alertContainer.innerHTML = '';

            // Validate
            if (!fullName || !email || !phone || !password || !confirmPassword) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Please fill in all required fields.
                    </div>
                `;
                return;
            }

            // Validate full name
            if (!/^[A-Za-z\s]+$/.test(fullName) || fullName.length < 3) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Full Name must contain only letters and spaces, minimum 3 characters.
                    </div>
                `;
                return;
            }

            // Validate phone
            if (!/^[0-9]{10}$/.test(phone)) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Phone Number must be exactly 10 digits.
                    </div>
                `;
                return;
            }

            if (!Utils.isValidEmail(email)) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Please enter a valid email address (must end with .com).
                    </div>
                `;
                return;
            }

            // Validate password has no spaces
            if (/\s/.test(password)) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Password must not contain spaces.
                    </div>
                `;
                return;
            }

            if (password.length < 6) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Password must be at least 6 characters long.
                    </div>
                `;
                return;
            }

            if (password !== confirmPassword) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Passwords do not match.
                    </div>
                `;
                return;
            }

            // Set loading state
            Utils.setButtonLoading(registerBtn, true);

            try {
                const result = await Auth.register({
                    fullName: fullName,
                    email: email,
                    phone: phone,
                    password: password
                });

                if (result.success) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-success">
                            <i class="bi bi-check-circle me-2"></i>
                            ${result.message} Redirecting to login...
                        </div>
                    `;

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            ${result.message}
                        </div>
                    `;
                    Utils.setButtonLoading(registerBtn, false);
                }
            } catch (error) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        ${error.message || 'Registration failed. Please try again.'}
                    </div>
                `;
                Utils.setButtonLoading(registerBtn, false);
            }
        });
    </script>
</body>
</html>
